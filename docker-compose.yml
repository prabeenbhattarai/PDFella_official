# Local processing stack: the Python worker (+ optional ClamAV).
#   docker compose up worker            # then set WORKER_URL=http://127.0.0.1:8080 in .env.local
#   docker compose --profile scan up    # adds malware scanning
services:
  worker:
    build: services/worker
    ports: ["8080:8080"]
    environment:
      APP_SECRET: ${APP_SECRET:-dev-local-secret-0123456789}
      CLAMD_HOST: ${CLAMD_HOST:-}
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports: ["3310:3310"]
